services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: veritas
      POSTGRES_USER: ${POSTGRES_USER:-veritas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-veritas}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-veritas} -d veritas"]
      interval: 5s
      retries: 10

  minio:
    # Official minio/minio Docker Hub images are no longer published (see docs/DECISIONS.md ADR-007)
    image: ${MINIO_IMAGE:-cgr.dev/chainguard/minio:latest}
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports: ["9001:9001"]
    volumes: [miniodata:/data]

  backend:
    build:
      context: ./backend
      args:
        WITH_OCR: ${WITH_OCR:-0}
    environment:
      VERITAS_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-veritas}:${POSTGRES_PASSWORD:-veritas}@postgres:5432/veritas
      VERITAS_STORAGE_BACKEND: minio
      VERITAS_MINIO_ENDPOINT: minio:9000
      VERITAS_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      VERITAS_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      VERITAS_BOOTSTRAP_ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      VERITAS_BOOTSTRAP_ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      VERITAS_COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_started }  # image has no shell/mc; backend retries the bucket check

  frontend:
    build: ./frontend
    ports: ["8080:80"]
    depends_on: [backend]

volumes:
  pgdata:
  miniodata:
